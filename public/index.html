<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Affiliate Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">♪</span>
      <div>
        <h1>TikTok Affiliate Finder</h1>
        <p class="sub">หาสินค้าขายดีสำหรับทำ Live และวิดีโอ · ร้านไทยบน TikTok Shop</p>
      </div>
    </div>
    <div class="status">
      <span class="badge" id="providerBadge" hidden></span>
      <span id="updated" class="muted"></span>
      <button id="refresh" class="btn" hidden>รีเฟรช</button>
    </div>
  </header>

  <main>
    <section class="filters">
      <div class="seg" id="sort">
        <button data-value="sales" class="active">🔥 ขายดี</button>
        <button data-value="growth">🚀 มาแรง</button>
        <button data-value="commission" data-needs="commission">💰 ค่าคอมสูง</button>
        <button data-value="opportunity" data-needs="creators">🎯 คู่แข่งน้อย</button>
      </div>
      <div class="seg" id="channel" data-needs="channels">
        <button data-value="all" class="active">ทุกช่องทาง</button>
        <button data-value="live">🔴 Live</button>
        <button data-value="video">🎬 วิดีโอ</button>
      </div>
      <div class="seg" id="days">
        <button data-value="1">1 วัน</button>
        <button data-value="7" class="active">7 วัน</button>
        <button data-value="30">30 วัน</button>
      </div>
    </section>
    <section class="filters">
      <label class="field">หมวดหมู่
        <select id="category"><option value="">ทุกหมวด</option></select>
      </label>
      <label class="field" data-needs="commission">ค่าคอมขั้นต่ำ
        <select id="minCommission">
          <option value="0">ทั้งหมด</option>
          <option value="0.1">10% ขึ้นไป</option>
          <option value="0.15">15% ขึ้นไป</option>
          <option value="0.2">20% ขึ้นไป</option>
        </select>
      </label>
      <label class="field search">ค้นหา
        <input id="search" type="search" placeholder="ชื่อสินค้าหรือร้าน" autocomplete="off">
      </label>
      <button id="starFilter" class="btn star-filter" aria-pressed="false">⭐ ที่เก็บไว้ <span id="starCount">0</span></button>
    </section>
    <p id="sortHelp" class="help"></p>

    <section class="card">
      <div class="card-head">
        <h2 id="chartTitle">แนวโน้มยอดขาย 5 อันดับแรก</h2>
        <span class="muted">ยอดขายรายวัน 30 วันล่าสุด (ชิ้น)</span>
      </div>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 id="tableTitle">อันดับสินค้า</h2>
        <div class="head-actions">
          <span class="muted">กดที่สินค้าเพื่อดูรายละเอียด</span>
          <button id="export" class="btn">⬇ ส่งออก Excel</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="star-col" aria-label="เก็บไว้"></th>
              <th class="num">#</th>
              <th>สินค้า</th>
              <th class="num" id="salesHead">ยอดขาย</th>
              <th class="num" data-needs="commission">ค่าคอม</th>
              <th class="hide-sm" data-needs="channels">ช่องทางขาย</th>
              <th class="num hide-sm" data-needs="creators">ครีเอเตอร์</th>
              <th class="num hide-sm" data-needs="soldTotal">ยอดขายสะสม</th>
              <th class="num">เติบโต</th>
              <th class="hide-sm">14 วัน</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="muted empty" hidden>ไม่พบสินค้าตามตัวกรองนี้</p>
      <p id="notice" class="notice" hidden></p>
    </section>
  </main>

  <dialog id="detail">
    <form method="dialog" class="dialog-head">
      <div>
        <h3 id="dTitle"></h3>
        <p id="dMeta" class="muted"></p>
      </div>
      <div class="dialog-actions">
        <button type="button" id="dStar" class="btn">☆ เก็บไว้</button>
        <button class="btn icon" aria-label="ปิด">✕</button>
      </div>
    </form>
    <div id="dBadges" class="badges"></div>
    <div class="gallery" id="dGallery" hidden>
      <img id="dMainImg" class="gallery-main" alt="" referrerpolicy="no-referrer">
      <div class="gallery-thumbs" id="dThumbs"></div>
    </div>
    <div class="kpis" id="dKpis"></div>
    <div class="chart-wrap"><canvas id="detailChart"></canvas></div>
    <label class="note-field" id="dNoteWrap" hidden>โน้ตของฉัน
      <textarea id="dNote" rows="2" placeholder="เช่น ขอ sample แล้ว · ถ่ายคลิปวันศุกร์"></textarea>
    </label>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
